<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dubai Deal Sniper</title>
  <link rel="stylesheet" href="/styles.css?v=market-watch-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main>
    <header><div><h1 id="title">Dubai Deal Sniper</h1><p id="subtitle" class="muted"></p></div><span id="connection" class="badge">...</span></header>
    <p id="state" class="muted">Authenticating…</p>
    <section id="deals-view" class="view">
      <div id="overview" class="stats"></div>
      <div class="hero card"><h2 id="home-title"></h2><p id="home-text" class="muted"></p><div class="actions"><button id="home-search"></button><button id="home-market" class="secondary"></button><button id="refresh-data" class="secondary"></button></div></div>
      <h2 id="deals-title"></h2><div id="feed"></div>
    </section>
    <section id="market-view" class="view" hidden><h2 id="market-title"></h2><p id="market-help" class="muted"></p><div id="market"></div></section>
    <section id="search-view" class="view" hidden>
      <div class="card"><h2 id="search-title"></h2><p id="search-help" class="muted"></p><textarea id="search-query" rows="4"></textarea><button id="create-search"></button><p id="search-result" class="muted"></p></div>
      <div id="searches"></div>
    </section>
    <section id="saved-view" class="view" hidden><div id="saved"></div></section>
    <section id="settings-view" class="view" hidden>
      <form id="settings-form" class="card form-grid">
        <label><span id="budget-label"></span><input id="budget" type="number" min="1"></label>
        <label><span id="profit-label"></span><input id="profit" type="number" min="0" required></label>
        <label><span id="roi-label"></span><input id="roi" type="number" min="0" step="0.1" required></label>
        <label><span id="makes-label"></span><input id="makes" type="text"></label>
        <label><span id="years-label"></span><div class="row"><input id="min-year" type="number" min="1950" max="2100"><input id="max-year" type="number" min="1950" max="2100"></div></label>
        <label><span id="mileage-label"></span><input id="mileage" type="number" min="0"></label>
        <button id="save-settings" type="submit"></button><p id="settings-result" class="muted"></p>
      </form>
    </section>
    <section id="admin-view" class="view" hidden>
      <h2 id="admin-title">Project control</h2><p id="admin-summary" class="muted"></p><div id="admin-sources"></div>
    </section>
    <p id="error" class="danger"></p>
  </main>
  <nav id="tabs" hidden></nav>
  <script type="module" src="/tma.js?v=english-1"></script>
</body>
</html>
