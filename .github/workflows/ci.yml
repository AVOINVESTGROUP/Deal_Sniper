name: Проверка проекта

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check main.py src tests
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=45
      - name: Аудит зависимостей
        run: python -m pip_audit -r requirements.txt

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Проверить формат Terraform
        run: terraform -chdir=infra/terraform fmt -check
      - name: Проверить Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Собрать образ
        run: docker build -t deal-sniper:ci .
      - name: Проверить импорт приложения в runtime
        run: >-
          docker run --rm --entrypoint python deal-sniper:ci
          -c "from src.web import app; print(app.title)"
      - name: Проверить отсутствие сборочных инструментов в runtime
        run: >-
          docker run --rm --entrypoint python deal-sniper:ci
          -c "import importlib.util; names = ('pip', 'setuptools', 'wheel'); found = [name for name in names if importlib.util.find_spec(name)]; assert not found, found"
      - name: Блокирующая проверка образа Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deal-sniper:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Сформировать SARIF-отчёт Trivy
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deal-sniper:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Сохранить SARIF-отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14
